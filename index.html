<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramco Community ID Generator</title>
    <style>
        :root {
            --aramco-dark-green: #008430;
            --aramco-dark-blue: #00334D;
            --aramco-gray: #5F6369;
            --aramco-light-gray: #DADADA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 40px;
        }

        /* Input Controls Panel */
        .control-panel {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--aramco-dark-blue);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--aramco-gray);
        }

        .form-group input {
            padding: 8px 10px;
            border: 1px solid var(--aramco-light-gray);
            border-radius: 6px;
            font-size: 13px;
        }

        .print-btn {
            background-color: var(--aramco-dark-green);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .print-btn:hover {
            background-color: #006b26;
        }

        /* ID Card Layout */
        .id-card {
            width: 450px;
            height: 280px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid var(--aramco-light-gray);
            box-sizing: border-box;
        }

        .card-header {
            background-color: var(--aramco-dark-blue);
            color: #ffffff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            border-bottom: 3px solid var(--aramco-dark-green);
            box-sizing: border-box;
        }

        .card-header h2 {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.8px;
            margin: 0;
            text-transform: uppercase;
        }

        .card-header .logo {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.95;
            text-align: right;
            line-height: 1.2;
        }

        .card-body {
            padding: 18px 20px;
            display: flex;
            gap: 18px;
            flex-grow: 1;
        }

        .photo-container {
            width: 105px;
            height: 130px;
            background-color: #f7f9fa;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--aramco-light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--aramco-gray);
            font-size: 11px;
            flex-shrink: 0;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .info-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .user-name {
            font-size: 17px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0;
            line-height: 1.2;
        }

        .user-id {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--aramco-gray);
            margin: 2px 0 8px 0;
        }

        .details-grid {
            font-size: 11.5px;
            color: #4a5568;
            line-height: 1.5;
            border-top: 1px solid #edf2f7;
            padding-top: 8px;
        }

        .details-grid div {
            display: flex;
            justify-content: space-between;
        }

        .details-grid span.label {
            color: var(--aramco-gray);
        }

        .details-grid span.value {
            font-weight: 500;
            color: #2d3748;
        }

        .card-footer {
            padding: 0 20px 14px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            color: var(--aramco-gray);
            border-top: 1px solid #f0f2f5;
            padding-top: 10px;
        }

        /* Print Settings */
        @media print {
            body {
                background: none;
                display: block;
            }
            .control-panel {
                display: none;
            }
            .id-card {
                box-shadow: none;
                border: none;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Control / Input Panel -->
    <div class="control-panel">
        <h3>Card Details Form</h3>
        
        <div class="form-group">
            <label>Upload Photo</label>
            <input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)">
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="inputName" value="Mohammed Mohsin" oninput="updateText('cardName', this.value)">
        </div>

        <div class="form-group">
            <label>Employee / Badge Number</label>
            <input type="text" id="inputEmpId" value="8762474" oninput="updateText('cardEmpId', this.value)">
        </div>

        <div class="form-group">
            <label>Contract Company</label>
            <input type="text" id="inputContract" value="SRACO" oninput="updateText('cardContract', this.value)">
        </div>

        <div class="form-group">
            <label>CS Department</label>
            <input type="text" id="inputDept" value="SA CSD" oninput="updateText('cardDept', this.value)">
        </div>

        <div class="form-group">
            <label>KSA License</label>
            <input type="text" id="inputLicense" value="223384227" oninput="updateText('cardLicense', this.value)">
        </div>

        <div class="form-group">
            <label>Card ID #</label>
            <input type="text" id="inputCardId" value="SACSD-78645629" oninput="updateText('cardCardId', this.value)">
        </div>

        <div class="form-group">
            <label>Expires Date</label>
            <input type="text" id="inputExpires" value="Sep 19, 2029" oninput="updateText('cardExpires', this.value)">
        </div>

        <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
    </div>

    <!-- ID Card Display -->
    <div class="id-card">
        <div class="card-header">
            <h2>Community Driver Permit</h2>
            <div class="logo">أرامكو السعودية<br>saudi aramco</div>
        </div>

        <div class="card-body">
            <div class="photo-container" id="photoContainer">
                <span id="photoPlaceholder">Photo</span>
                <img id="userPhoto" alt="User Photo">
            </div>

            <div class="info-container">
                <div>
                    <h1 class="user-name" id="cardName">Mohammed Mohsin</h1>
                    <div class="user-id" id="cardEmpId">8762474</div>
                </div>

                <div class="details-grid">
                    <div><span class="label">Contract:</span> <span class="value" id="cardContract">SRACO</span></div>
                    <div><span class="label">CS Dept:</span> <span class="value" id="cardDept">SA CSD</span></div>
                    <div><span class="label">KSA License:</span> <span class="value" id="cardLicense">223384227</span></div>
                </div>
            </div>
        </div>

        <div class="card-footer">
            <span id="cardCardId">ID #: SACSD-78645629</span>
            <span id="cardExpires">Expires: Sep 19, 2029</span>
        </div>
    </div>

    <script>
        function updateText(elementId, value) {
            document.getElementById(elementId).innerText = value;
        }

        function loadPhoto(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('userPhoto');
                output.src = reader.result;
                output.style.display = 'block';
                document.getElementById('photoPlaceholder').style.display = 'none';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
